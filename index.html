<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEO Baba 2026 - AI Viral Content</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#0f172a;color:#f1f5f9;overflow:hidden}
.home-screen{position:fixed;top:0;left:0;width:100%;height:100vh;background:url('https://i.ibb.co/h1sYwVZq/20250615-161054.png') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding-bottom:60px}
.start-btn{background:linear-gradient(90deg,#3b82f6,#2563eb);color:white;border:none;padding:18px 45px;font-size:20px;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 10px 25px rgba(59,130,246,0.5);transition:all 0.3s}
.start-btn:active{transform:scale(0.95)}
.tool-screen{display:none;min-height:100vh;padding:20px;background:#0f172a;overflow-y:auto}
.back-btn{background:#1e293b;border:1px solid #334155;color:#f1f5f9;padding:10px 20px;border-radius:8px;cursor:pointer;margin-bottom:20px;font-size:16px}
.back-btn i{margin-right:8px}
.container{max-width:600px;margin:0 auto}
.header{text-align:center;margin-bottom:25px}
.header h1{font-size:28px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.header p{color:#94a3b8;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s}
.card:active{transform:scale(0.97);background:#334155}
.card i{font-size:32px;margin-bottom:10px;color:#38bdf8}
.card h3{font-size:16px;margin-bottom:5px}
.card p{font-size:12px;color:#94a3b8}
.keyword-box{margin-bottom:20px}
.keyword-label{display:flex;align-items:center;margin-bottom:8px;color:#cbd5e1;font-size:15px}
.keyword-label i{margin-right:8px;color:#38bdf8}
.keyword-input{width:100%;padding:14px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:16px}
.keyword-input:focus{outline:none;border-color:#38bdf8}
.result-box{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;min-height:200px;display:none}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.result-title{font-size:18px;color:#38bdf8}
.copy-btn{background:#334155;border:none;color:#f1f5f9;padding:8px 15px;border-radius:6px;cursor:pointer;font-size:14px}
.copy-btn:active{background:#475569}
.result-content{line-height:1.8;color:#cbd5e1;white-space:pre-wrap}
.loading{text-align:center;padding:40px;color:#94a3b8}
.loading i{font-size:40px;margin-bottom:10px;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.error{color:#f87171;text-align:center;padding:20px}
.footer{text-align:center;margin-top:30px;color:#64748b;font-size:13px;padding-bottom:20px}
.footer a{color:#94a3b8;margin:0 10px;text-decoration:none}
</style>
</head>
<body>
<div class="home-screen" id="homeScreen">
<button class="start-btn" onclick="showTool()">Start Now</button>
</div>

<div class="tool-screen" id="toolScreen">
<button class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i> Back</button>
<div class="container">
<div class="header">
<h1>SEO Baba 2026</h1>
<p>AI Viral Content Generator - 2026 Algorithm</p>
</div>
<div class="grid">
<div class="card" onclick="selectType('description')">
<i class="fas fa-file-alt"></i>
<h3>Viral Description</h3>
<p>Rank + WatchTime</p>
</div>
<div class="card" onclick="selectType('title')">
<i class="fas fa-heading"></i>
<h3>CTR Title</h3>
<p>High Click Rate</p>
</div>
<div class="card" onclick="selectType('hashtags')">
<i class="fas fa-hashtag"></i>
<h3>Trend Tags</h3>
<p>2026 Trending</p>
</div>
<div class="card" onclick="selectType('caption')">
<i class="fas fa-comment"></i>
<h3>Viral Caption</h3>
<p>Reels + Shorts</p>
</div>
</div>
<div class="keyword-box">
<div class="keyword-label"><i class="fas fa-fire"></i> Enter Trending Keyword/Topic</div>
<input type="text" class="keyword-input" id="keywordInput" placeholder="e.g. AI tools 2026, weight loss challenge">
</div>
<div class="result-box" id="resultBox">
<div class="result-header">
<div class="result-title" id="resultTitle">Result</div>
<button class="copy-btn" onclick="copyResult()"><i class="fas fa-copy"></i> Copy</button>
</div>
<div class="result-content" id="resultContent"></div>
</div>
<div class="footer">
<a href="about.html">About</a> |
<a href="contact.html">Contact</a> |
<a href="privacy-policy.html">Privacy Policy</a>
<br><br>© 2026 SEO Baba. All rights reserved.
</div>
</div>
</div>

<script>
// ⚠️ YAHAN APNI GEMINI API KEY DALO ⚠️
const GEMINI_API_KEY = 'AIzaSyAMGPgislmrJwUjiax8KeuinG73_SdsZUg';

const homeScreen=document.getElementById('homeScreen');
const toolScreen=document.getElementById('toolScreen');
const resultBox=document.getElementById('resultBox');
const resultContent=document.getElementById('resultContent');
const resultTitle=document.getElementById('resultTitle');
const keywordInput=document.getElementById('keywordInput');

function showTool(){
homeScreen.style.display='none';
toolScreen.style.display='block';
document.body.style.overflow='auto';
}

function showHome(){
toolScreen.style.display='none';
homeScreen.style.display='flex';
document.body.style.overflow='hidden';
resultBox.style.display='none';
keywordInput.value='';
}

function selectType(type){
const keyword=keywordInput.value.trim();
if(!keyword){alert('Enter trending keyword first!');return;}
generateContent(keyword,type);
}

async function generateContent(keyword,type){
resultBox.style.display='block';
resultContent.innerHTML='<div class="loading"><i class="fas fa-spinner"></i><p>Analyzing 2026 Trends...</p></div>';
resultTitle.textContent=type.charAt(0).toUpperCase()+type.slice(1)+' - 2026 Optimized';

let prompt='';
const year = new Date().getFullYear();

// 99.9% SEO + TRENDING PROMPTS 2026
if(type==='description'){
prompt=`You are a YouTube Algorithm Expert for 2026. Create a VIRAL YouTube description for "${keyword}".

STRICT SEO RULES 2026:
1. First 125 characters: Hook + exact keyword "${keyword}" + curiosity. This shows in search.
2. Word count: 150-180 words. YouTube 2026 prefers this length.
3. Keyword density: Use "${keyword}" exactly 5 times. Use 6 LSI keywords naturally.
4. Structure: Hook > Problem > Solution > Timestamps > CTA > Hashtags.
5. Timestamps mandatory: 0:00 Hook, 0:15 Problem, 0:45 Solution, 2:30 Results, 3:00 CTA.
6. CTA: "Subscribe + Bell Icon" + "Comment '${keyword} 2026' if you agree".
7. End with 3 hashtags: #${keyword.replace(/\s+/g,'')} #${keyword.replace(/\s+/g,'')}2026 #Viral${year}
8. NO fluff. NO "Hello friends". NO emojis. NO generic lines. Direct value only.
9. Use 2026 trending words: Ultimate Guide, Secret, Proven, Challenge, Transformation.

Output ONLY the description text.`;

}else if(type==='title'){
prompt=`You are a CTR Specialist for YouTube 2026. Generate 5 VIRAL titles for "${keyword}" that get 15%+ CTR.

2026 TITLE ALGORITHM RULES:
1. Length: 58-62 characters. Perfect for mobile + desktop.
2. Pattern: Number + Power Word + Keyword + Curiosity + Year.
3. Main keyword "${keyword}" must be within first 25 characters.
4. Power Words 2026: Exposed, Secret, Ultimate, Banned, Shocking, Proven, Hidden.
5. Numbers: Use odd numbers 3,5,7,11. They get 20% more clicks.
6. Curiosity: End with... or? to create open loop.
7. Add ${year} at end for freshness boost.
8. NO clickbait lies. Must deliver in video.
9. NO brackets [] or pipes |. YouTube 2026 demotes these.

Example format: 7 Shocking ${keyword} Secrets That Went Viral in ${year}...

Output ONLY 5 numbered titles. No explanation.`;

}else if(type==='hashtags'){
prompt=`You are Instagram + YouTube Hashtag Algorithm Expert 2026. Generate 18 TRENDING hashtags for "${keyword}".

2026 HASHTAG STRATEGY:
1. Mix: 3 Mega 10M+, 5 Large 1M-10M, 5 Medium 100K-1M, 5 Small 10K-100K.
2. 2026 Rule: No #love #instagood #follow. Algorithm marks as spam.
3. Format: All lowercase, no spaces. #${keyword.replace(/\s+/g,'').toLowerCase()}
4. Add year tags: #${keyword.replace(/\s+/g,'').toLowerCase()}${year}, #viral${year}
5. Add niche tags: #${keyword.replace(/\s+/g,'').toLowerCase()}tips, #${keyword.replace(/\s+/g,'').toLowerCase()}challenge
6. Research: Use tags that are trending TODAY for "${keyword}".
7. NO explanations. NO categories. ONLY hashtags.

Output: 18 hashtags separated by single space.`;

}else if(type==='caption'){
prompt=`You are Instagram Reels + YouTube Shorts Expert 2026. Write 3 VIRAL captions for "${keyword}".

2026 VIRAL CAPTION FORMULA:
1. Hook Line: First 8 words decide if user stops scrolling. Use pattern: "POV: You finally found..."
2. Length: 90-110 words per caption. Algorithm 2026 pushes this.
3. Keyword "${keyword}" exactly 3 times per caption.
4. Structure: Hook > Relatable Story > Value > Question CTA > Hashtags.
5. Emojis: Exactly 3 per caption. Place after hook, middle, CTA.
6. CTA Question: Must end with question to boost comments. Example: "Which tip will you try first?"
7. Hashtags: 5 hashtags at end. Format #${keyword.replace(/\s+/g,'')} #viral${year}
8. NO "Link in bio". NO "DM me". 2026 algorithm reduces reach.
9. Separate each caption with ---

Output ONLY 3 captions with --- separator.`;

}

try{
const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_API_KEY}`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
contents:[{parts:[{text:prompt}]}],
generationConfig:{
temperature:0.3,
topP:0.7,
topK:30,
maxOutputTokens:1200
}
})
});
const data=await res.json();
if(data.candidates&&data.candidates[0]){
resultContent.textContent=data.candidates[0].content.parts[0].text;
}else{
resultContent.innerHTML='<div class="error">API Error: Check your Gemini key or quota.</div>';
}
}catch(err){
resultContent.innerHTML='<div class="error">Network Error: Key galat hai ya internet issue.</div>';
}
}

function copyResult(){
const text=resultContent.textContent;
navigator.clipboard.writeText(text).then(()=>{
const btn=document.querySelector('.copy-btn');
btn.innerHTML='<i class="fas fa-check"></i> Copied!';
setTimeout(()=>{btn.innerHTML='<i class="fas fa-copy"></i> Copy';},2000);
});
}
</script>
</body>
</html>
