<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Baba 2026 - 99.9 Full SEO Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #0f172a; 
      color: white; 
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .menu { font-size: 24px; cursor: pointer; }
    .policy { 
      background: #1e293b; 
      padding: 8px 15px; 
      border-radius: 20px;
      font-size: 14px;
    }
    .search-box {
      width: 100%;
      padding: 15px;
      border: 2px solid #22c55e;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .tagline {
      text-align: right;
      font-size: 12px;
      color: #22c55e;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }
    .box:hover { border-color: #22c55e; }
    .idea-box {
      background: #1e293b;
      border: 2px solid #22c55e;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .ads-box {
      background: #1e293b;
      border: 1px dashed #475569;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      color: #64748b;
    }
    h1 { 
      text-align: center; 
      color: #22c55e; 
      margin: 20px 0;
      font-size: 28px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="menu">☰</div>
    <div class="policy">Web Policy</div>
  </div>

  <h1>🔥 SEO BABA 2026 🔥</h1>
  
  <input type="text" class="search-box" placeholder="Enter your keyword/topic here...">
  
  <div class="tagline">Web provide you 99.9 full SEO Service</div>

  <div class="grid">
    <div class="box">Description</div>
    <div class="box">Title</div>
    <div class="box">Hashtag</div>
    <div class="box">Caption</div>
  </div>

  <div class="idea-box">
    💡 Discuss your Idea
  </div>

  <div class="ads-box">
    Ads Space
  </div>

</body>
</html>
